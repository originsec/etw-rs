[workspace]
members = [".", "etw-rs-macros", "example-providers", "tools/generate-provider"]
resolver = "2"

[workspace.package]
# Verified by the `msrv` CI job, not asserted. 1.88 is the floor because
# etw-rs-macros uses let-chains, stable from 1.88; edition 2024 alone would only
# require 1.85.
rust-version = "1.88"

[package]
name = "etw-rs"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors = ["John Uhlmann <john@originhq.com>"]
license = "Apache-2.0"
description = "Rust bindings for Event Tracing for Windows (ETW) with minimal abstraction"
repository = "https://github.com/originsec/etw-rs"
readme = "README.md"
keywords = ["etw", "event", "tracing", "windows"]
categories = ["os::windows-apis"]
# Package only the library. Examples, tests, and benches all depend on the
# unpublished example-providers workspace crate, so they could not compile
# from the .crate file anyway; cargo strips their target sections at package
# time. README and LICENSE are listed to keep them without a force-include
# warning.
include = ["/src", "/README.md", "/CHANGELOG.md", "/LICENSE"]
# Library only: the CLI is the separate etw-rs-generate-provider crate.
autobins = false

[dependencies]
# `version` is what crates.io consumers resolve; `path` wins for local builds.
etw-rs-macros = { path = "etw-rs-macros", version = "0.1.0" }
log = "0.4"
rustc-hash = "2.0"
thiserror = "2"
# The raw-ABI sibling of the `windows` crate: same generated declarations,
# no wrapper methods and no proc-macro machinery, so consumers compile a
# fraction of the code. No windows-sys type crosses the public API, so
# bumping this is a patch-level change.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Diagnostics_Debug", # FormatMessageW for error rendering
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
anyhow = "1"
criterion = "0.5"
ctrlc = "3.4"
env_logger = "0.11"
example-providers = { path = "example-providers" }
ferrisetw = "1.2"
# `#[serial(<key>)]` per-test serialisation for integration tests that use
# the limited system logger slots. Lets unrelated tests run in parallel.
serial_test = "3"
tracelogging_dynamic = "1.2.4"
# Tests, benches, and examples keep the full `windows` crate for its
# conveniences (EVENT_RECORD mocks, typed constants, `FileTimeToSystemTime`
# as the oracle in `tests/differential_filetime.rs`). Dev-only: consumers
# never see it.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

# Debug symbols in bench binaries so a profiler can attribute samples to
# individual parser functions (M-HOTPATH). Does not affect optimisation level,
# so measured timings are unchanged.
[profile.bench]
debug = 1

[[bench]]
name = "parsing"
harness = false

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "parser_comparison"
harness = false

[[bench]]
name = "rundown_parsing"
harness = false

[[bench]]
name = "live_events"
harness = false

[features]
default = []

[lib]
name = "etw"
path = "src/lib.rs"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]

[target.'cfg(not(windows))'.dependencies]
# Placeholder to allow docs.rs to build on non-Windows platforms

[[example]]
