[lints]
workspace = true

# Shared by every published crate via `[lints] workspace = true`
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"                  # All public items must be documented
unreachable_pub = "warn"               # Catch pub items that should be pub(crate)
missing_debug_implementations = "warn" # All public types must impl Debug
# Future: uncomment when stabilized
# unsafe_attr_outside_unsafe = "deny"

# Clippy: Enable strict linting with documented exceptions
# Run `./ci/check.ps1 lint` to check
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Restriction lints (cherry-picked for safety)
dbg_macro = "warn"                  # No debug macros in production
print_stdout = "warn"               # Use log crate, not println (except examples)
print_stderr = "warn"               # Use log crate, not eprintln
unwrap_used = "warn"                # Prefer expect() or proper error handling
expect_used = "warn"                # Prefer proper error handling over expect()
todo = "warn"                       # No TODOs in committed code
unimplemented = "warn"              # No unimplemented!() in committed code
as_underscore = "warn"              # `as _` hides the target type
clone_on_ref_ptr = "warn"           # Cloning Arc/Rc should be explicit
empty_structs_with_brackets = "warn" # Use `struct Foo;` not `struct Foo {}`
format_push_string = "warn"         # Use write! instead of format! + push_str
if_then_some_else_none = "warn"     # Use .then() or .then_some()
mixed_read_write_in_expression = "warn" # Avoid confusing read/write in same expr
needless_raw_strings = "warn"       # Don't use r"" when not needed
redundant_type_annotations = "warn" # Remove redundant type annotations
rest_pat_in_fully_bound_structs = "warn" # Don't use .. when all fields bound
semicolon_outside_block = "warn"    # Consistent semicolon placement
try_err = "warn"                    # Avoid Err(e)? — use return Err(e) directly
unnecessary_safety_comment = "warn" # Remove outdated SAFETY comments
unnecessary_safety_doc = "warn"     # Remove outdated # Safety docs
mem_forget = "warn"                 # mem::forget can leak resources
undocumented_unsafe_blocks = "warn" # All unsafe blocks need SAFETY comments
str_to_string = "warn"              # Use .to_owned() instead of .to_string() on &str
implicit_clone = "warn"              # Prefer explicit .clone() over .to_owned()/.to_vec() on Clone types
rc_mutex = "warn"                   # Rc<Mutex<T>> is usually wrong
self_named_module_files = "warn"    # Use mod.rs style, not foo/foo.rs

# Additional restriction lints (practical safety/correctness)
cfg_not_test = "warn"               # #[cfg(not(test))] is almost always wrong — prefer #[cfg(test)]
empty_enum_variants_with_brackets = "warn" # Use `Variant` not `Variant {}`
float_cmp_const = "warn"            # Don't compare floats with == to constants
fn_to_numeric_cast_any = "warn"     # Casting function pointers to numbers is suspicious
get_unwrap = "warn"                 # Use [] indexing or .get().expect() instead of .get().unwrap()
infinite_loop = "warn"              # Detect infinite loops that could be `loop {}`
mutex_atomic = "warn"               # Use atomics instead of Mutex for single values
partial_pub_fields = "warn"         # Struct with mix of pub/private fields is suspicious
pub_without_shorthand = "warn"      # Use `pub(crate)` not `pub(in crate)`
renamed_function_params = "warn"    # Params renamed in impl vs trait definition
same_name_method = "warn"           # Method has same name as method from trait in scope
unnecessary_self_imports = "warn"   # Don't use `use foo::{self}` when unnecessary
verbose_file_reads = "warn"         # Use fs::read_to_string instead of File+read_to_string

# Cherry-picked nursery lints
transmute_undefined_repr = "warn"   # Transmuting ETW buffers needs a defined repr
trailing_empty_array = "warn"       # C trailing-array structs are a parsing hazard
debug_assert_with_mut_call = "warn" # debug_assert! must not have side effects
redundant_clone = "warn"            # Clones on the event path are not free
use_self = "warn"                   # Prefer Self over repeating the type name
missing_const_for_fn = "warn"       # Prefer const fn where the body allows it
needless_pass_by_ref_mut = "warn"   # &mut that is never used mutably

# Allowed pedantic: These lints are too noisy for practical use
missing_errors_doc = "allow"        # Error docs would be repetitive
missing_panics_doc = "allow"        # Panic docs would be repetitive
module_name_repetitions = "allow"   # e.g., session::Trace is fine
must_use_candidate = "allow"        # Too many false positives
too_many_lines = "allow"            # Functions can be long when clear
similar_names = "allow"             # e.g., data1/data2/data3 in GUIDs
unreadable_literal = "allow"        # GUIDs use standard hex format
cast_possible_truncation = "allow"  # Win32 APIs require casts
cast_sign_loss = "allow"            # Win32 APIs require casts
cast_possible_wrap = "allow"        # Win32 APIs require casts
cast_lossless = "allow"             # Win32 FFI requires pervasive as-casts; From:: churn adds no value
doc_markdown = "allow"              # TraceLogging etc. don't need backticks
items_after_statements = "allow"    # Local consts/structs near their use
cast_ptr_alignment = "allow"        # ETW structures have known alignment — see docs/etw_buffer_alignment.md
